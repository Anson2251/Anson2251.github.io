name: Blog code quality

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - ".github/workflows/blog-biome.yml"
  pull_request:
    branches: [main]
    paths:
      - "blog/**"
      - ".github/workflows/blog-biome.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: latest

      - name: Run Biome
        run: biome ci ./src --reporter=github
